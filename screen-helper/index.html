<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Screen Helper</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f3f3f5; --accent:#d97757; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#eee; --muted:#999; --card:#2c2c2e; } }
  body { margin:0; font:14px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { padding:12px; display:flex; gap:8px; align-items:center; }
  button { border:0; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; background:var(--card); color:var(--fg); }
  button.primary { background:var(--accent); color:#fff; }
  #log { flex:1; overflow-y:auto; padding:0 12px; }
  .q { color:var(--muted); margin-top:12px; }
  .a { background:var(--card); border-radius:10px; padding:10px; white-space:pre-wrap; }
  form { display:flex; gap:8px; padding:12px; }
  input { flex:1; border-radius:8px; border:1px solid var(--card); padding:8px; font:inherit; background:var(--bg); color:var(--fg); }
  .hint { color:var(--muted); font-size:12px; padding:0 12px; }
</style>
</head>
<body>
  <header>
    <button class="primary" id="look">Look at my screen</button>
    <button id="key">API key</button>
  </header>
  <form id="keyform" hidden>
    <input id="keyinput" type="password" placeholder="Paste Anthropic API key (sk-ant-…)">
    <button>Save</button>
  </form>
  <div class="hint">Shortcut: ⌘ ⇧ Space</div>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Ask a follow-up…" autocomplete="off">
    <button>Ask</button>
  </form>
  <script src="renderer.js"></script>
</body>
</html>
